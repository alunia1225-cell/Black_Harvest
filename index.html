<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Black Harvest</title>
<style>
html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e12;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}button{font:inherit}
#game{position:relative}canvas{display:block;width:100%;height:100%}.hud{position:absolute;left:12px;top:12px;background:#0b0e13e8;padding:10px 14px;border:1px solid #39414d;border-radius:8px;z-index:3}.title{font-size:22px;font-weight:800}.stats{font-size:13px;margin-top:5px;color:#d5dae1}.msg{position:absolute;left:12px;top:95px;z-index:3;background:#11151bd9;color:#f2d56b;padding:8px 11px;border-radius:6px;max-width:90vw}.buttons{position:absolute;right:12px;top:12px;z-index:3;display:flex;gap:6px;z-index:5}.buttons button,.touch button{background:#252c35;color:#fff;border:1px solid #4a5563;border-radius:8px;padding:9px 12px}.panel{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:82vh;overflow:auto;background:#0d1117f8;border:1px solid #4b5563;border-radius:12px;padding:18px;z-index:10}.panel.open{display:block}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1b2129;padding:10px;margin:7px 0;border-radius:7px}.row small{display:block;color:#aeb6c0}.touch{position:absolute;left:12px;bottom:12px;z-index:4;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:4px}.touch button{padding:0;font-size:20px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.close{float:right}
</style></head><body><div id="game"><canvas id="canvas"></canvas><div class="hud"><div class="title">BLACK HARVEST</div><div id="stats" class="stats"></div></div><div id="msg" class="msg">WASD / 矢印で移動、Eで建物、Iでインベントリ</div><div class="buttons"><button id="inventory">インベントリ</button><button id="save">セーブ</button><button id="next">次の日</button></div><div class="touch"><button class="up" data-dy="-1">↑</button><button class="left" data-dx="-1">←</button><button class="down" data-dy="1">↓</button><button class="right" data-dx="1">→</button></div><div id="panel" class="panel"><button id="close" class="close">閉じる</button><h2>インベントリ</h2><div id="inventoryList"></div></div></div><script src="./main.js"></script></body></html>
